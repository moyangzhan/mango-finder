[package]
name = "mango-finder"
version = "0.12.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mango_finder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.2", features = [] }

[dependencies]
tauri = { version = "2.9.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2.0.0-rc"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
log = "0.4"
reqwest = { version = "0.12.23", features = ["json"] }
futures = "0.3.31"
tokio = { version = "1", features = ["full"] }
async-openai = { version = "0.29.2", features = ["byot"] }
aes = "0.8"
cbc = "0.1"
block-padding = "0.3"
rusqlite = { version = "0.37.0", features = ["bundled"] }
sqlite-vec = "0.1.6"
rand = "0.9.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
ort = "=2.0.0-rc.12"
ndarray = "0.17"
tokenizers = { version = "0.22.1", default-features = false, features = [
  "onig",
] }
text-splitter = { version = "0.28.0", features = ["tokenizers"] }
# doc、ppt parser (used by ODT/ODP/ODS loaders)
zip = "6.0.0"
quick-xml = "0.38.3"
thiserror = "2.0.17"
anyhow = "1.0.100"
base64 = "0.22.1"
rust-i18n = "3.1.5"
infer = "0.19.0"
async-trait = "0.1.89"
csv = "1.3.1"
derive_builder = "0.20.2"
md-5 = "0.10.6"
chrono = "0.4.42"
notify = "8.2.0"
aho-corasick = "1.1"
rayon = "1.7"
smallvec = "1.11"
uuid = { version = "1.19.0", features = ["v4"] }
tauri-plugin-process = "2"
jieba-rs = "0.8.1"
regex = "1.12.2"
sys-locale = "0.3.2"
image = "0.25.9"
bincode = "1.3.3"
# Document parsing
anytomd = { version = "1.2.2", default-features = false }
pdfplumber = "0.2.0"
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
flate2 = "1"
# OCR (PaddleOCR for Chinese+English text recognition)
kreuzberg-paddle-ocr = "4.9.5"
symphonia = { version = "0.5.5", features = ["all"] }
whisper-rs = "0.15"
image_hasher = "3.1"

# CLI dependencies
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
dirs = "6"
env_logger = "0.11"

# Network / Multi-device dependencies
axum = "0.7"
socket2 = "0.5"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
mdns-sd = "0.11"
local-ip-address = "0.6"
hostname = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Networking_WinSock"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[[bin]]
name = "mfd"
path = "src/cli/main.rs"
