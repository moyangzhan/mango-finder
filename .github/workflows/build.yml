name: Build Mango Finder

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      CXXFLAGS: /utf-8
      CFLAGS: /utf-8
    steps:
      - uses: actions/checkout@v4
        # replace with the huggingface download
        # with:
        #   lfs: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.2.3
      - name: Install LLVM 18
        run: |
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/LLVM-18.1.8-win64.exe" -OutFile "LLVM-18.1.8-win64.exe"
          Start-Process -FilePath ".\LLVM-18.1.8-win64.exe" -ArgumentList "/S" -NoNewWindow -Wait
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
        shell: pwsh
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Hugging Face Hub
        run: pip install huggingface_hub
      - name: Download Models from Hugging Face
        run: |
          python -c "
          from huggingface_hub import hf_hub_download
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='embedding.onnx', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='embedding_tokenizer.json', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='vision.onnx', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='vision_tokenizer.json', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='whisper-small-q8_0.bin', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='ch_PP-OCRv4_det_infer.onnx', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='ch_ppocr_mobile_v2.0_cls_infer.onnx', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='ch_PP-OCRv4_rec_infer.onnx', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='ppocr_keys_v1.txt', local_dir='./src-tauri/assets/model')
          "
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Clean Tauri WiX Cache
        run: |
          Remove-Item -Path "$env:LOCALAPPDATA\tauri\WixTools*" -Recurse -Force -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Build Windows (Full)
        run: pnpm tauri build --config src-tauri/tauri.full.conf.json
      - name: Collect Full artifact
        shell: bash
        run: |
          mkdir -p dist
          for f in src-tauri/target/release/bundle/msi/*.msi; do
            cp "$f" "dist/$(basename "$f" .msi)_Full.msi"
          done
      # Lite = coinstallable, fully isolated product: the lite cargo feature
      # (own data dir, port 15679, db seed) + the lite config overlay
      # (own productName/identifier/window title)
      - name: Build Windows (Lite)
        run: pnpm tauri build --features lite --config src-tauri/tauri.lite.conf.json
      - name: Collect Lite artifact
        shell: bash
        run: |
          for f in src-tauri/target/release/bundle/msi/*.msi; do
            cp "$f" "dist/$(basename "$f" .msi)_Lite.msi"
          done
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        # with:
        #   lfs: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Hugging Face Hub
        run: pip install huggingface_hub
      - name: Download Models from Hugging Face
        run: |
          python -c "
          from huggingface_hub import hf_hub_download
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='embedding.onnx', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='embedding_tokenizer.json', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='vision.onnx', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='vision_tokenizer.json', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='whisper-small-q8_0.bin', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='ch_PP-OCRv4_det_infer.onnx', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='ch_ppocr_mobile_v2.0_cls_infer.onnx', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='ch_PP-OCRv4_rec_infer.onnx', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='ppocr_keys_v1.txt', local_dir='./src-tauri/assets/model')
          "
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # The runner image points apt at azure.archive.ubuntu.com, which
      # occasionally stops resolving on hosted runners; apt then retries for
      # hours and finally fails. Retry quickly, cap the step, and fall back to
      # the upstream archive when the mirror itself is unreachable.
      - name: Install Linux Dependencies
        shell: bash
        timeout-minutes: 20
        run: |
          set -uo pipefail

          apt_retry() {
            local attempt
            for attempt in 1 2 3 4; do
              if "$@"; then return 0; fi
              echo "::warning::apt attempt $attempt failed: $*"
              sleep 15
            done
            return 1
          }

          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)

          if ! apt_retry sudo apt-get "${apt_opts[@]}" update; then
            echo "::warning::apt update failed, switching the mirror to archive.ubuntu.com"
            sudo sed -i -E 's#https?://azure\.archive\.ubuntu\.com#http://archive.ubuntu.com#g' \
              /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            apt_retry sudo apt-get "${apt_opts[@]}" update
          fi

          apt_retry sudo apt-get "${apt_opts[@]}" install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build Linux (Full)
        run: pnpm tauri build --config src-tauri/tauri.full.conf.json
      - name: Collect Full artifact
        shell: bash
        run: |
          mkdir -p dist
          for f in src-tauri/target/release/bundle/deb/*.deb; do
            cp "$f" "dist/$(basename "$f" .deb)_Full.deb"
          done
      - name: Build Linux (Lite)
        run: pnpm tauri build --features lite --config src-tauri/tauri.lite.conf.json
      - name: Collect Lite artifact
        shell: bash
        run: |
          for f in src-tauri/target/release/bundle/deb/*.deb; do
            cp "$f" "dist/$(basename "$f" .deb)_Lite.deb"
          done
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/*

  build-macos:
    # macos-14 image was retired on 2026-11-02; the label now fails with
    # "The configuration 'macos-14-arm64-us-default' is not supported".
    runs-on: macos-15
    env:
      CFLAGS: -U__ARM_FEATURE_MATMUL_INT8
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@v4
        # with:
        #   lfs: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - name: Install CMake
        uses: lukka/get-cmake@latest
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install Hugging Face Hub
        run: pip install huggingface_hub
      - name: Download Models from Hugging Face
        run: |
          python -c "
          from huggingface_hub import hf_hub_download
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='embedding.onnx', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='embedding_tokenizer.json', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='vision.onnx', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='vision_tokenizer.json', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='whisper-small-q8_0.bin', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='ch_PP-OCRv4_det_infer.onnx', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='ch_ppocr_mobile_v2.0_cls_infer.onnx', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='ch_PP-OCRv4_rec_infer.onnx', local_dir='./src-tauri/assets/model')
          hf_hub_download(repo_id='moyangzhan/mango-finder', filename='ppocr_keys_v1.txt', local_dir='./src-tauri/assets/model')
          "
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # DMG bundling is the only flaky part of this job: bundle_dmg.sh gives up
      # with EBUSY when Spotlight still holds the freshly mounted image, and
      # tauri 2.9.x drops the script output from the error, so the failure is
      # invisible. Retry with verbose logging (cargo/vite are incremental) and
      # detach any volume a previous attempt left behind.
      - name: Build macOS (Apple Silicon, Full)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm tauri build --verbose --config src-tauri/tauri.full.conf.json; then
              exit 0
            fi
            echo "::warning::macOS Full build attempt $attempt failed, cleaning up"
            for vol in /Volumes/dmg.*; do
              if [ -d "$vol" ]; then hdiutil detach "$vol" -force || true; fi
            done
            rm -f src-tauri/target/release/bundle/macos/rw.*.dmg
            sleep 20
          done
          echo "::error::macOS Full build failed after 3 attempts"
          exit 1
      - name: Collect Full artifact
        shell: bash
        run: |
          mkdir -p dist
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            cp "$f" "dist/$(basename "$f" .dmg)_Full.dmg"
          done
      - name: Build macOS (Apple Silicon, Lite)
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm tauri build --verbose --features lite --config src-tauri/tauri.lite.conf.json; then
              exit 0
            fi
            echo "::warning::macOS Lite build attempt $attempt failed, cleaning up"
            for vol in /Volumes/dmg.*; do
              if [ -d "$vol" ]; then hdiutil detach "$vol" -force || true; fi
            done
            rm -f src-tauri/target/release/bundle/macos/rw.*.dmg
            sleep 20
          done
          echo "::error::macOS Lite build failed after 3 attempts"
          exit 1
      - name: Collect Lite artifact
        shell: bash
        run: |
          for f in src-tauri/target/release/bundle/dmg/*.dmg; do
            cp "$f" "dist/$(basename "$f" .dmg)_Lite.dmg"
          done
      # Intel Mac build disabled - uncomment if needed for Intel Mac users
      # (re-enabling needs cross-compile care: --target x86_64-apple-darwin, and the mfd pre-build in beforeBuildCommand must match that triple;
      #  macos-13 is retired too, run this job on `macos-15-intel` instead of the arm64 labels)
      # - name: Build macOS (Intel)
      #   run: pnpm tauri build --target x86_64-apple-darwin
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/*

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "::debug::Previous tag found: '$PREVIOUS_TAG'"

          CHANGELOG_CONTENT=""
          GIT_LOG_COMMAND=""

          if [ -z "$PREVIOUS_TAG" ]; then
            GIT_LOG_COMMAND='git log --pretty=format:"* %s (%h)"'
            CHANGELOG_CONTENT=$(git log --pretty=format:"* %s (%h)")
          else
            GIT_LOG_COMMAND="git log --pretty=format:\"* %s (%h)\" $PREVIOUS_TAG..HEAD"
            CHANGELOG_CONTENT=$(git log --pretty=format:"* %s (%h)" $PREVIOUS_TAG..HEAD)
          fi
          echo "::debug::Executing command: $GIT_LOG_COMMAND"
          echo "::debug::Raw git log output:"
          echo "$CHANGELOG_CONTENT"
          echo "::debug::End of raw git log output."
          DELIMITER=$(openssl rand -hex 8) 
          echo "::debug::Writing to GITHUB_OUTPUT with delimiter $DELIMITER"
          printf "%s<<%s\n%s\n%s\n" "CHANGELOG" "$DELIMITER" "$CHANGELOG_CONTENT" "$DELIMITER" >> "$GITHUB_OUTPUT"
          echo "::debug::Finished writing to GITHUB_OUTPUT."
        shell: bash

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List Files
        run: find artifacts -type f | sort

      - name: Get existing release body
        id: existing_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(gh release view "${{ github.ref_name }}" --json body -q '.body' 2>/dev/null || echo "")
          # multi-line output needs a heredoc delimiter; bare echo breaks the runner
          DELIMITER=$(openssl rand -hex 8)
          printf "found_body<<%s\n%s\n%s\n" "$DELIMITER" "$BODY" "$DELIMITER" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build release body
        id: build_body
        env:
          EXISTING_BODY: ${{ steps.existing_release.outputs.found_body }}
          CHANGELOG: ${{ steps.changelog.outputs.CHANGELOG }}
        run: |
          {
            echo "$EXISTING_BODY"
            echo ""
            echo "---"
            echo ""
            echo "#### Changelog"
            echo "$CHANGELOG"
          } | sed '/^$/N;/^\n$/d' > body.md
          # Remove trailing blank lines
          sed -i -e :a -e '/^\n*$/{$d;N;ba' -e '}' body.md
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows-build/*.msi
            artifacts/linux-build/*.deb
            # artifacts/linux-build/rpm/*.rpm
            # artifacts/linux-build/appimage/*.AppImage
            artifacts/macos-build/*.dmg
            # artifacts/macos-build/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          name: Release ${{ github.ref_name }}
          body_path: body.md
          draft: false
          prerelease: false
